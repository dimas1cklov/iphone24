<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scratch promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;family=Oswald:wght@600&amp;display=swap">
<style>
.bg{animation:bgshift 10s ease-in-out infinite}
@keyframes bgshift{0%,100%{background-position:0% 0%}50%{background-position:100% 60%}}
.s1{animation:s1 10s infinite}
@keyframes s1{0%{opacity:0;transform:scale(.9)}3%{opacity:1;transform:scale(1)}43%{opacity:1;transform:scale(1)}46%,100%{opacity:0;transform:scale(.92)}}
.s2{animation:s2 10s infinite}
@keyframes s2{0%,45%{opacity:0}47%,83%{opacity:1}86%,100%{opacity:0}}
.s3{animation:s3 10s infinite}
@keyframes s3{0%,85%{opacity:0}87%,98%{opacity:1}100%{opacity:0}}
.flip{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform;animation:flip 10s linear infinite}
@keyframes flip{0%,10.8%{transform:perspective(1400px) rotateY(0deg);animation-timing-function:cubic-bezier(.45,.05,.25,1)}17.5%,100%{transform:perspective(1400px) rotateY(180deg)}}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(1px)}
.back{transform:rotateY(180deg) translateZ(1px)}
.logo{animation:logo 10s ease-in-out infinite}
@keyframes logo{0%{transform:scale(.6) rotate(-20deg)}5%{transform:scale(1.05) rotate(4deg)}8%,100%{transform:scale(1) rotate(0)}}
.foil{will-change:clip-path;animation:foil 10s linear infinite}
@keyframes foil{0%,23%{clip-path:inset(0 0 0 0)}37%,100%{clip-path:inset(0 0 0 100%)}}
.code{animation:codepop 10s infinite}
@keyframes codepop{0%,37%{transform:scale(1);animation-timing-function:cubic-bezier(.3,1.6,.5,1)}39.5%{transform:scale(1.08);animation-timing-function:ease-out}42%,100%{transform:scale(1)}}
.tap1{will-change:transform,opacity;animation:tap1 10s linear infinite}
@keyframes tap1{0%,6%{opacity:0;transform:translate(330px,560px) scale(1);animation-timing-function:cubic-bezier(.2,.8,.2,1)}9.5%{opacity:1;transform:translate(290px,380px) scale(1)}10.5%{opacity:1;transform:translate(290px,380px) scale(.82)}11.5%{opacity:1;transform:translate(290px,380px) scale(1);animation-timing-function:ease-in}13.5%{opacity:0;transform:translate(320px,520px) scale(1)}20%{opacity:0;transform:translate(194px,420px) scale(1);animation-timing-function:cubic-bezier(.2,.8,.2,1)}23%{opacity:1;transform:translate(194px,356px) scale(.9)}25%{transform:translate(225px,349px) scale(.9)}27%{transform:translate(256px,363px) scale(.9)}29%{transform:translate(287px,349px) scale(.9)}31%{transform:translate(318px,363px) scale(.9)}33%{transform:translate(349px,349px) scale(.9)}35%{transform:translate(380px,363px) scale(.9)}37%{opacity:1;transform:translate(410px,356px) scale(.9);animation-timing-function:ease-in}41%,100%{opacity:0;transform:translate(440px,560px) scale(1)}}
.form{animation:form 10s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes form{0%,48%{opacity:0;transform:translateY(80px) scale(.9)}52%,78%{opacity:1;transform:translateY(0) scale(1)}82%,100%{opacity:0;transform:translateY(0) scale(.6)}}
.type1{animation:type1 10s steps(12,end) infinite}
@keyframes type1{0%,53%{width:0}61%,100%{width:100%}}
.type2{animation:type2 10s steps(15,end) infinite}
@keyframes type2{0%,63%{width:0}71%,100%{width:100%}}
.btn{animation:btn 10s infinite}
@keyframes btn{0%,75%{transform:scale(1)}76.5%{transform:scale(.92);filter:brightness(1.2)}78%,100%{transform:scale(1)}}
.tap2{animation:tap2 10s ease-in-out infinite}
@keyframes tap2{0%,72%{opacity:0;transform:translate(330px,720px)}75%{opacity:1;transform:translate(272px,628px)}76.5%{transform:translate(272px,628px) scale(.85)}78%{opacity:1;transform:translate(272px,628px) scale(1)}81%,100%{opacity:0;transform:translate(330px,740px)}}
.truck{animation:truck 10s cubic-bezier(.3,.7,.3,1) infinite}
@keyframes truck{0%,86%{transform:translateX(-520px)}90%,95%{transform:translateX(0)}100%{transform:translateX(560px)}}
.wheel{animation:wheel .5s linear infinite}
@keyframes wheel{to{transform:rotate(360deg)}}
.box{animation:box .4s ease-in-out infinite alternate}
@keyframes box{to{transform:translateY(-4px)}}
.ripple{animation:ripple 1s ease-out infinite}
@keyframes ripple{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
html,body{margin:0;height:100%;background:#000}
body{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="bg" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #fff; background: radial-gradient(60% 45% at 25% 30%, #b21fe0 0%, rgba(0,0,0,0) 70%), radial-gradient(70% 50% at 80% 75%, #c21bd6 0%, rgba(0,0,0,0) 70%), linear-gradient(160deg, #3a0a7a 0%, #6a11c9 45%, #2b0566 100%); background-size: 160% 160%">

<div style="position: absolute; left: -62px; top: 70px; width: 580px; height: 800px; transform: scale(.886); transform-origin: 0 0">

<!-- SCENE 1: card -->
<div class="s1" style="position: absolute; inset: 0">
  <div class="flip" style="position: absolute; left: 100px; top: 128px; width: 380px; height: 500px">
    <div class="face" style="position: absolute; inset: 0; border-radius: 22px; background: #f7f7f9; box-shadow: 0 30px 60px rgba(20,0,50,.45); display: flex; flex-direction: column; align-items: center; justify-content: center">
      <div style="font-size: 26px; font-weight: 800; color: #111; margin-bottom: 20px; letter-spacing: 0.5px;">Apple Gift Card</div>
      <img class="logo" src="https://cdn.imagetourls.com/uploads/tyImg/atsbYZtl.png" alt="Logo" style="width: 230px; height: 230px; object-fit: contain;">
    </div>
    <div class="face back" style="position: absolute; inset: 0; border-radius: 22px; background: #f2f2f4; box-shadow: 0 30px 60px rgba(20,0,50,.45); overflow: hidden; color: #111; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 22px 0 14px">
        <div style="width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #ff3d7f, #ff8a00 50%, #7b2ff7)"></div>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px">Gift Card</span>
      </div>
      <div style="background: #111; color: #fff; text-align: center; font-size: 15px; font-weight: 600; padding: 8px 0">The gift card for everything.</div>
      <p style="margin: 12px 28px 10px; font-size: 10.5px; line-height: 1.35; text-align: center; color: #333">This card can be used for apps, games, music, movies, shows, cloud storage, accessories and more.</p>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 0 26px">
        <div style="height: 40px; border-radius: 10px; background: linear-gradient(160deg, #2ab0ff, #1062f0)"></div>
        <div style="height: 40px; border-radius: 10px; background: linear-gradient(160deg, #ff5b72, #f0203f)"></div>
        <div style="height: 40px; border-radius: 10px; background: #111"></div>
        <div style="height: 40px; border-radius: 10px; background: linear-gradient(160deg, #ff8a3d, #f04d1f)"></div>
        <div style="height: 40px; border-radius: 10px; background: linear-gradient(160deg, #7fd3ff, #2a8cff)"></div>
        <div style="height: 40px; border-radius: 10px; background: #fff; border: 2px solid #111; box-sizing: border-box"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; margin: 20px 22px 0">
        <div style="font-size: 9px; line-height: 1.3; width: 62px; color: #333">Scratch gently to reveal code</div>
        <div class="code" style="position: relative; flex: 1; height: 44px; border-radius: 10px; background: #fff; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; letter-spacing: 1px; overflow: hidden">
          <span>7KQ2-MX19-PL04</span>
          <div class="foil" style="position: absolute; inset: 0; background: repeating-linear-gradient(115deg, #9a9aa3 0 6px, #b7b7bf 6px 12px, #8b8b95 12px 16px)"></div>
        </div>
        <div style="width: 38px; height: 38px; border: 2px solid #111; border-radius: 6px; box-sizing: border-box"></div>
      </div>
      <div style="display: flex; gap: 14px; margin: 18px 22px 0; align-items: flex-start">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 5px">
          <div style="height: 5px; background: #bbb; border-radius: 3px"></div>
          <div style="height: 5px; background: #bbb; border-radius: 3px; width: 92%"></div>
          <div style="height: 5px; background: #bbb; border-radius: 3px; width: 85%"></div>
          <div style="height: 5px; background: #bbb; border-radius: 3px; width: 70%"></div>
        </div>
        <div style="width: 58px; height: 58px; background: conic-gradient(#111 0 25%, #fff 0 50%, #111 0 75%, #fff 0) 0 0 / 12px 12px; border: 3px solid #111; box-sizing: border-box"></div>
      </div>
      <div style="margin: 16px 40px 0; height: 48px; background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 4px, #111 4px 7px, transparent 7px 9px, #111 9px 10px, transparent 10px 13px)"></div>
    </div>
  </div>
  <div class="tap1" style="position: absolute; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; z-index: 6">
    <div class="ripple" style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid #fff"></div>
    <div style="position: absolute; inset: 12px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 6px 18px rgba(0,0,0,.35)"></div>
  </div>
</div>

<!-- SCENE 2: phone + form -->
<div class="s2" style="position: absolute; inset: 0">
  <img src="https://cdn.imagetourls.com/uploads/tyImg/Ag5Riqo0.png" alt="Phone" style="position: absolute; left: 30px; top: -89px; width: 520px; height: 636px; object-fit: contain; filter: drop-shadow(0 24px 40px rgba(20,0,50,.5))">
  <div class="form" style="position: absolute; left: 110px; top: 330px; width: 360px; padding: 26px 28px 28px; box-sizing: border-box; border-radius: 20px; background: rgba(215,222,245,.95); box-shadow: 0 30px 60px rgba(20,0,50,.4); display: flex; flex-direction: column; align-items: center; gap: 14px; color: #111">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff3d7f, #ff8a00 50%, #7b2ff7)"></div>
    <div style="width: 100%; height: 44px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">
      <span class="type1" style="display: inline-block; overflow: hidden; white-space: nowrap; max-width: 140px"><span style="display: inline-block; width: 140px; text-align: center">Julia Parker</span></span>
    </div>
    <div style="width: 100%; height: 44px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600">
      <span class="type2" style="display: inline-block; overflow: hidden; white-space: nowrap; max-width: 200px"><span style="display: inline-block; width: 200px; text-align: center">CA, Ottawa, Hill 17</span></span>
    </div>
    <button class="btn" type="button" style="width: 100%; height: 46px; border: 0; border-radius: 23px; background: #2f6bff; color: #fff; font-family: inherit; font-size: 18px; font-weight: 800; letter-spacing: .5px; margin-top: 4px">GET IT</button>
  </div>
  <div class="tap2" style="position: absolute; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; z-index: 6">
    <div class="ripple" style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid #fff"></div>
    <div style="position: absolute; inset: 12px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 6px 18px rgba(0,0,0,.35)"></div>
  </div>
</div>

<!-- SCENE 3: delivery truck -->
<div class="s3" style="position: absolute; inset: 0">
  <div style="position: absolute; left: 150px; top: 250px; width: 280px; height: 280px; border-radius: 50%; background: rgba(255,120,255,.25)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 520px; height: 3px; background: rgba(0,0,0,.45)"></div>
  <div class="truck" style="position: absolute; left: 80px; top: 300px; width: 420px; height: 224px">
    <div class="box" style="position: absolute; left: 20px; top: 46px; width: 64px; height: 44px; background: #f5c58a; border: 3px solid #222; border-radius: 4px; box-sizing: border-box"></div>
    <div class="box" style="position: absolute; left: 88px; top: 46px; width: 64px; height: 44px; background: #f5c58a; border: 3px solid #222; border-radius: 4px; box-sizing: border-box"></div>
    <div class="box" style="position: absolute; left: 54px; top: 6px; width: 54px; height: 40px; background: #f0b877; border: 3px solid #222; border-radius: 4px; box-sizing: border-box"></div>
    <div style="position: absolute; left: 0; top: 90px; width: 250px; height: 70px; background: #5fc4e0; border: 4px solid #222; border-radius: 8px; box-sizing: border-box"></div>
    <div style="position: absolute; left: 246px; top: 28px; width: 150px; height: 132px; background: #5fc4e0; border: 4px solid #222; border-radius: 10px 46px 10px 10px; box-sizing: border-box"></div>
    <div style="position: absolute; left: 266px; top: 46px; width: 92px; height: 58px; background: #b48cf2; border: 4px solid #222; border-radius: 6px 30px 6px 6px; box-sizing: border-box"></div>
    <div style="position: absolute; left: 380px; top: 120px; width: 28px; height: 18px; background: #ffd34d; border: 3px solid #222; border-radius: 4px; box-sizing: border-box"></div>
    <div style="position: absolute; left: -6px; top: 156px; width: 420px; height: 16px; background: #3f6fa8; border: 4px solid #222; border-radius: 6px; box-sizing: border-box"></div>
    <div class="wheel" style="position: absolute; left: 40px; top: 146px; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, #ddd 0 10px, #222 11px 15px, #9aa 16px 24px, #222 25px); border: 2px solid #222; box-sizing: border-box"></div>
    <div class="wheel" style="position: absolute; left: 290px; top: 146px; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, #ddd 0 10px, #222 11px 15px, #9aa 16px 24px, #222 25px); border: 2px solid #222; box-sizing: border-box"></div>
  </div>
</div>

</div>
<div style="position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; font-family: Oswald, Inter, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 1px; color: #fff; opacity: .92; z-index: 5">FOR ILLUSTRATION PURPOSES ONLY</div>
</div>
</body>
</html>
